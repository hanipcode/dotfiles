unbind r
bind r source-file ~/.tmux.conf
bind-key r source ~/.tmux.conf \; display-message "tmux.conf reloaded."

set -g prefix C-a
set -g mouse on

# Pass mouse events to TUI apps (nvim, opencode, claude, node, bun for opencode/node/bun apps)
bind -n WheelUpPane if-shell -F '#{||:#{||:#{||:#{||:#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},opencode}},#{==:#{pane_current_command},claude}},#{==:#{pane_current_command},node}},#{==:#{pane_current_command},bun}},#{==:#{pane_current_command},opencode.exe}}' \
  'send-keys -M' \
  'copy-mode -e'

bind -n WheelDownPane if-shell -F '#{||:#{||:#{||:#{||:#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},opencode}},#{==:#{pane_current_command},claude}},#{==:#{pane_current_command},node}},#{==:#{pane_current_command},bun}},#{==:#{pane_current_command},opencode.exe}}' \
  'send-keys -M' \
  'send-keys -M'

# Only send drag events to Neovim, OpenCode, Claude, Node, and Bun apps, don't enter copy-mode
bind -n MouseDrag1Pane if-shell -F '#{||:#{||:#{||:#{||:#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},opencode}},#{==:#{pane_current_command},claude}},#{==:#{pane_current_command},node}},#{==:#{pane_current_command},bun}},#{==:#{pane_current_command},opencode.exe}}' \
  'send-keys -M' \
  'copy-mode -M'

# Also block double-click (optional)
bind -n DoubleClick1Pane if-shell -F '#{||:#{||:#{||:#{||:#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},opencode}},#{==:#{pane_current_command},claude}},#{==:#{pane_current_command},node}},#{==:#{pane_current_command},bun}},#{==:#{pane_current_command},opencode.exe}}' \
  'send-keys -M' \
  'copy-mode -M'
  
bind -n MouseDown1Pane if-shell -F '#{||:#{||:#{||:#{||:#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},opencode}},#{==:#{pane_current_command},claude}},#{==:#{pane_current_command},node}},#{==:#{pane_current_command},bun}},#{==:#{pane_current_command},opencode.exe}}' 'send-keys -M' ''
bind -n MouseUp1Pane if-shell -F '#{||:#{||:#{||:#{||:#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},opencode}},#{==:#{pane_current_command},claude}},#{==:#{pane_current_command},node}},#{==:#{pane_current_command},bun}},#{==:#{pane_current_command},opencode.exe}}' 'send-keys -M' ''


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Smart pane switching with awareness of Neovim panes (vim-tmux-navigator counterpart).
# In a vim pane the key is passed through so the plugin handles it; elsewhere tmux switches panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
# C-l is taken by pane navigation now; use prefix + C-l to clear the terminal
bind C-l send-keys 'C-l'
# Ctrl+q: close current pane immediately, no confirmation
bind -n C-q kill-pane

bind -r H resize-pane -L 2
bind -r L resize-pane -R 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


set -g @catppuccin_flavour 'macchiato' # latte,frappe, macchiato or mocha
set-option -g status-position bottom
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -s escape-time 0
set-option -g pane-active-border-style fg=black

set -g base-index 1
setw -g pane-base-index 1

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"



# Window title = tmux session name (lets sketchybar agent chips focus the right window)
set -g set-titles on
set -g set-titles-string '#S'
